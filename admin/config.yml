# Decap CMS – Live Impianti S.r.l.
# Sviluppo e gestione: RF Digital
# Dopo il salvataggio → deploy automatico Netlify (con Git collegato)

backend:
  name: git-gateway
  branch: main

# Solo sviluppo locale: decommentare e avviare `npx decap-server`
# local_backend: true

media_folder: images
public_folder: images

locale: it

# Branding nel pannello CMS
logo_url: /images/liveimpianti_logo.png
site_url: /
display_url: /

# Testi visibili in CMS (se supportati dalla versione)
# @see admin/index.html per splash RF Digital

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: home
    label: "01 · Pagina Home (hero e statistiche)"
    files:
      - name: home
        label: Hero, statistiche 1200+/20+/100%, CTA
        file: content/home.json
        fields:
          - label: Hero
            name: hero
            widget: object
            collapsed: false
            fields:
              - { label: Badge, name: badge, widget: string }
              - { label: "Titolo riga 1", name: titoloRiga1, widget: string }
              - { label: "Parola in evidenza", name: titoloAccent, widget: string }
              - { label: "Titolo riga 2", name: titoloRiga2, widget: string }
              - { label: Sottotitolo, name: sottotitolo, widget: text }
              - { label: "Pulsante primario", name: pulsantePrimario, widget: string }
              - { label: "Link pulsante primario", name: pulsantePrimarioLink, widget: string }
              - { label: "Pulsante secondario", name: pulsanteSecondario, widget: string }
              - { label: "Link pulsante secondario", name: pulsanteSecondarioLink, widget: string }
              - label: Statistiche in fondo al hero (1200+, 20+, 100%)
                name: statistiche
                widget: list
                max: 3
                fields:
                  - { label: Numero, name: numero, widget: number }
                  - { label: Suffisso (+, %), name: suffisso, widget: string, required: false }
                  - { label: Etichetta, name: etichetta, widget: string }
          - label: Sezione Progetti (intestazione)
            name: sezioneProgetti
            widget: object
            collapsed: true
            fields:
              - { label: Tag, name: tag, widget: string }
              - { label: Titolo, name: titolo, widget: string }
              - { label: Descrizione, name: descrizione, widget: text }
          - label: Fascia CTA
            name: cta
            widget: object
            collapsed: true
            fields:
              - { label: Titolo, name: titolo, widget: string }
              - { label: Descrizione, name: descrizione, widget: text }
              - { label: Testo pulsante, name: pulsante, widget: string }
              - { label: Link pulsante, name: pulsanteLink, widget: string }

  - name: servizi
    label: "02 · Card Servizi (homepage)"
    files:
      - name: servizi
        label: Elenco servizi in Home
        file: content/servizi.json
        fields:
          - label: Intestazione sezione
            name: intestazione
            widget: object
            fields:
              - { label: Tag, name: tag, widget: string }
              - { label: Titolo, name: titolo, widget: string }
              - { label: Descrizione, name: descrizione, widget: text }
          - label: Servizi
            name: voci
            widget: list
            summary: "{{titolo}}"
            fields:
              - label: Icona
                name: icona
                widget: select
                options:
                  - { label: "Full electric", value: elettrico }
                  - { label: Fotovoltaico, value: fotovoltaico }
                  - { label: Radiante, value: radiante }
                  - { label: Domotica, value: domotica }
                  - { label: "VMC", value: vmc }
                  - { label: "Centrali termiche", value: centrali }
              - { label: Titolo, name: titolo, widget: string }
              - { label: Descrizione, name: descrizione, widget: text }
              - { label: Ordine, name: ordine, widget: number, default: 1 }

  - name: chi-siamo
    label: "03 · Sezione Chi siamo"
    files:
      - name: chi-siamo
        label: Testi Chi siamo
        file: content/chi-siamo.json
        fields:
          - label: Intestazione
            name: intestazione
            widget: object
            fields:
              - { label: Tag, name: tag, widget: string }
              - { label: "Titolo LIVE", name: titoloLive, widget: string }
              - { label: "Titolo IMPIANTI", name: titoloImpianti, widget: string }
          - { label: Testo principale, name: lead, widget: text }
          - label: Punti di forza
            name: puntiForza
            widget: list
            fields:
              - { label: Titolo, name: titolo, widget: string }
              - { label: Testo, name: testo, widget: text }
          - label: Barra statistiche
            name: barraStatistiche
            widget: list
            fields:
              - { label: Valore, name: valore, widget: string }
              - { label: Etichetta, name: etichetta, widget: string }
          - label: Pannello visivo (destra)
            name: pannelloVisivo
            widget: object
            collapsed: true
            fields:
              - { label: Sopratitolo, name: overline, widget: string }
              - { label: Sottotitolo, name: sottotitolo, widget: string }
              - label: Statistiche pannello
                name: statistiche
                widget: list
                fields:
                  - { label: Valore, name: valore, widget: string }
                  - { label: Etichetta, name: etichetta, widget: string }
                  - { label: "In evidenza (verde)", name: accent, widget: boolean, default: false }
              - label: Pillole
                name: pillole
                widget: list
                field: { label: Testo, name: pillola, widget: string }

  - name: catalogo
    label: "04 · Catalogo progetti"
    files:
      - name: progetti
        label: Tutti i progetti
        file: progetti.json
        fields:
          - label: Categorie (non modificare gli ID)
            name: categorie
            widget: list
            collapsed: true
            fields:
              - { label: ID (non modificare), name: id, widget: string, hint: "ville | radianti | fotovoltaico | centrali" }
              - { label: Nome categoria, name: nome, widget: string }
              - { label: Descrizione sotto il banner, name: descrizione, widget: text, hint: "Testo in italiano visibile nella sezione Progetti" }
              - { label: Foto banner categoria, name: banner, widget: image, required: false }
              - { label: Posizione foto (CSS), name: bannerPosition, widget: string, required: false, hint: "Es. center 42%" }
              - { label: Classe CSS banner, name: bannerClass, widget: string, required: false, hint: "Es. acc-category-banner--2" }
              - { label: Ordine, name: ordine, widget: number, default: 1 }

          - label: Progetti
            name: progetti
            widget: list
            summary: "{{titolo}} — {{categoria}}"
            fields:
              - label: ID univoco (slug)
                name: id
                widget: string
                hint: "Solo minuscole e trattini, es. villa-roma-nord"
                pattern: ['^[a-z0-9-]+$', 'Usa solo lettere minuscole, numeri e trattini']

              - label: Categoria
                name: categoria
                widget: select
                options:
                  - { label: "Ville full electric", value: ville }
                  - { label: "Sistemi radianti", value: radianti }
                  - { label: Fotovoltaico, value: fotovoltaico }
                  - { label: "Centrali termiche", value: centrali }

              - label: Ordine in categoria
                name: ordine
                widget: number
                default: 1
                min: 1

              - label: Etichetta (Villa, Hotel, 317 kW…)
                name: label
                widget: string

              - label: Stile etichetta Home
                name: labelStile
                widget: select
                required: false
                options:
                  - { label: Normale, value: "" }
                  - { label: Potenza kW, value: kw }
                  - { label: Pubblico, value: pub }

              - label: Foto principale
                name: immagine
                widget: image
                media_folder: images
                public_folder: images

              - label: Titolo breve (lista progetti)
                name: titolo
                widget: string

              - label: Titolo completo (dettaglio)
                name: titoloCompleto
                widget: string

              - label: Titolo Home (opzionale)
                name: titoloHome
                widget: string
                required: false

              - label: Località
                name: location
                widget: string

              - label: Descrizione breve
                name: descrizione
                widget: text

              - label: Descrizione completa
                name: descrizioneCompleta
                widget: text

              - label: Impianti realizzati
                name: features
                widget: list
                field: { label: Voce, name: voce, widget: string }

              - label: Tag in evidenza
                name: tags
                widget: list
                required: false
                field: { label: Tag, name: tag, widget: string }

              - label: Progetto speciale (badge)
                name: featured
                widget: boolean
                default: false

              - label: Mostra in Home (anteprima prioritaria)
                name: showOnHome
                widget: boolean
                default: false
                hint: "Tutti i progetti della categoria compaiono nel carosello; questo marca le priorità."

  - name: azienda
    label: "05 · Azienda, contatti e mappa"
    files:
      - name: azienda
        label: Telefono, email, sede, footer
        file: content/azienda.json
        fields:
          - { label: "Ragione sociale", name: ragioneSociale, widget: string }
          - { label: Tagline footer, name: tagline, widget: string }
          - { label: Descrizione breve footer, name: descrizioneBreve, widget: text }
          - { label: Telefono (visualizzato), name: telefono, widget: string }
          - { label: "Telefono link (es. +393881692517)", name: telefonoLink, widget: string }
          - { label: "WhatsApp (solo numeri)", name: whatsapp, widget: string }
          - { label: Email contatti, name: email, widget: string, hint: "Es. info@liveimpianti.it" }
          - { label: "Partita IVA", name: partitaIva, widget: string, hint: "Es. 12024031002" }
          - { label: Indirizzo, name: indirizzo, widget: string }
          - { label: "CAP e città", name: capCitta, widget: string }
          - { label: Orari, name: orari, widget: string }
          - { label: "URL mappa embed", name: mappaEmbed, widget: string, required: false }
          - { label: "Link Google Maps", name: linkGoogleMaps, widget: string, required: false }
          - { label: "Link recensione Google", name: linkRecensione, widget: string, required: false }
          - label: Sezione contatti (intestazione)
            name: sezioneContatti
            widget: object
            fields:
              - { label: Tag, name: tag, widget: string }
              - { label: Titolo, name: titolo, widget: string }
              - { label: Descrizione, name: descrizione, widget: text }
          - label: Footer
            name: footer
            widget: object
            fields:
              - { label: Copyright (footer), name: copyright, widget: string, hint: "Includere P.IVA nel testo" }
              - { label: Link Privacy, name: linkPrivacy, widget: string }
              - { label: Link Cookie, name: linkCookie, widget: string }

  - name: legale
    label: "06 · Privacy e Cookie Policy"
    files:
      - name: legale
        label: Documenti legali (testi in italiano)
        file: content/legale.json
        fields:
          - { label: Link pagina Privacy, name: linkPrivacy, widget: string, default: "privacy-policy.html" }
          - { label: Link pagina Cookie, name: linkCookie, widget: string, default: "cookie-policy.html" }
          - label: Privacy Policy
            name: privacy
            widget: object
            collapsed: false
            fields:
              - { label: Titolo, name: titolo, widget: string }
              - { label: Ultimo aggiornamento, name: ultimoAggiornamento, widget: string }
              - { label: Introduzione, name: intro, widget: text }
              - label: Sezioni
                name: sezioni
                widget: list
                summary: "{{titolo}}"
                fields:
                  - { label: Titolo sezione, name: titolo, widget: string }
                  - { label: Testo, name: testo, widget: text }
          - label: Cookie Policy
            name: cookie
            widget: object
            collapsed: true
            fields:
              - { label: Titolo, name: titolo, widget: string }
              - { label: Ultimo aggiornamento, name: ultimoAggiornamento, widget: string }
              - { label: Introduzione, name: intro, widget: text }
              - label: Sezioni
                name: sezioni
                widget: list
                summary: "{{titolo}}"
                fields:
                  - { label: Titolo sezione, name: titolo, widget: string }
                  - { label: Testo, name: testo, widget: text }
